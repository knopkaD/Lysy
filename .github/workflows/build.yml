name: Build APK
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create project
        run: |
          D=app/src/main
          mkdir -p $D/java/com/lysy/translator $D/assets $D/res/values $D/res/drawable
          cp index.html $D/assets/index.html

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "LysyTranslator"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.5.2" apply false }
          EOF

          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties

          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.lysy.translator"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.lysy.translator"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 3
                  versionName = "1.2"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > $D/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:icon="@drawable/ic_launcher"
                  android:label="Лысый переводчик"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $D/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#FF0F0C29</item>
                  <item name="android:statusBarColor">#FF0F0C29</item>
                  <item name="android:navigationBarColor">#FF0F0C29</item>
              </style>
          </resources>
          EOF

          cat > $D/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp"
              android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#FF7F5AF0" android:pathData="M0,24a24,24 0 1,0 48,0a24,24 0 1,0 -48,0z"/>
              <path android:fillColor="#FFFFE0BD" android:pathData="M12,25a12,13 0 1,0 24,0a12,13 0 1,0 -24,0z"/>
              <path android:fillColor="#CCFFFFFF" android:pathData="M17,17a4,2 0 1,0 8,0a4,2 0 1,0 -8,0z"/>
              <path android:fillColor="#FF2D2A4A" android:pathData="M18,25a1.5,1.5 0 1,0 3,0a1.5,1.5 0 1,0 -3,0z"/>
              <path android:fillColor="#FF2D2A4A" android:pathData="M27,25a1.5,1.5 0 1,0 3,0a1.5,1.5 0 1,0 -3,0z"/>
              <path android:strokeColor="#FF2D2A4A" android:strokeWidth="1.5" android:pathData="M19,30q5,4 10,0"/>
          </vector>
          EOF

          cat > $D/java/com/lysy/translator/MainActivity.java <<'EOF'
          package com.lysy.translator;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.
