name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Create project
        run: |
          test -f index.html || { echo "НЕТ ФАЙЛА index.html"; exit 1; }
          D=app/src/main
          mkdir -p $D/assets $D/java/com/lysy/translator
          cp index.html $D/assets/
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.5.2" apply false }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.lysy.translator"
              compileSdk = 34
              defaultConfig { applicationId = "com.lysy.translator"; minSdk = 26; targetSdk = 34; versionCode = 4; versionName = "1.3" }
          }
          EOF
          cat > $D/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Лысый переводчик" android:icon="@android:drawable/sym_def_app_icon"
                android:theme="@android:style/Theme.Material.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > $D/java/com/lysy/translator/MainActivity.java <<'EOF'
          package com.lysy.translator;
          import android.app.Activity;
          import android.content.*;
          import android.os.Bundle;
          import android.webkit.*;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.addJavascriptInterface(this, "Android");
                  w.loadUrl("file:///android_asset/index.html");
                  setContentView(w);
              }
              @JavascriptInterface public void copy(String t) {
                  ((ClipboardManager) getSystemService(CLIPBOARD_SERVICE)).setPrimaryClip(ClipData.newPlainText("t", t));
              }
              @JavascriptInterface public void share(String t) {
                  Intent i = new Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT, t);
                  startActivity(Intent.createChooser(i, "Поделиться"));
              }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LysyTranslator
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
